<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Card Manager</title>
    <link rel="icon" href="/gestion-tarjetas/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/gestion-tarjetas/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/gestion-tarjetas/apple-touch-icon.png">

    <!-- If already authenticated this session, skip straight to the app -->
    <script>
        if (sessionStorage.getItem('gtarjetas_lock_v2') === '1') {
            window.location.replace('./app.html');
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pin-lock/pin-lock.css">

    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            background: var(--pl-bg);
        }
    </style>
</head>
<body>

    <!-- Theme toggle (matches the app's design) -->
    <button class="pl-theme-toggle" id="theme-toggle" aria-label="Cambiar tema" type="button">
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1"  x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1"  y1="12" x2="3"  y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
            <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <script src="pin-lock/pin-lock.js"></script>
    <script>
        // ── Theme (synced with the app via localStorage) ──────────────
        (function () {
            const root     = document.documentElement;
            const toggle   = document.getElementById('theme-toggle');
            const sunIcon  = document.getElementById('icon-sun');
            const moonIcon = document.getElementById('icon-moon');

            function applyTheme(theme) {
                root.setAttribute('data-theme', theme);
                const isDark = theme === 'dark';
                sunIcon.hidden  = !isDark;
                moonIcon.hidden = isDark;
                toggle.setAttribute('aria-label', isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
            }

            const saved = localStorage.getItem('theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(saved);

            toggle.addEventListener('click', () => {
                const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', next);
                applyTheme(next);
            });
        })();

        // ── PIN Lock ──────────────────────────────────────────────────
        PinLock.init({
            pinHash:     'c9a971335ddf9f5e569c267e610e94159707214e089e3d8823690a58cef53121',
            pinLength:   5,
            maxAttempts: 5,
            lockoutMs:   30_000,
            sessionKey:  'gtarjetas_lock_v2',
            title:       'Card Manager',
            subtitle:    'Ingresá tu PIN para acceder',
            onSuccess() {
                window.location.replace('./app.html');
            },
        });
    </script>
</body>
</html>
