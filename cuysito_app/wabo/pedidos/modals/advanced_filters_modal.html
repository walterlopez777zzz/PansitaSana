<!-- Advanced Filters Modal -->
<div id="filters-modal" class="fixed inset-0 overflow-y-auto z-50 hidden" role="dialog" aria-modal="true" data-modal-backdrop>
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-black/70 backdrop-blur-[8px] transition-opacity" aria-hidden="true"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen">​</span>
        <div class="inline-block align-bottom bg-white dark:bg-gray-800 rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full animate-slide-up">
            <div class="bg-white dark:bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white">Filtros Avanzados</h3>
                    <button data-close-button type="button" class="text-gray-400 dark:text-gray-300 hover:text-gray-500 dark:hover:text-gray-200 transition"><i class="fas fa-times"></i></button>
                </div>
                <div class="space-y-6">
                    <!-- Categories -->
                    <div>
                        <h4 class="text-md font-medium text-gray-900 dark:text-white mb-3">Categorías</h4>
                        <div id="adv-filter-categories" class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3">
                            <!-- Checkboxes will be dynamically inserted here by JS -->
                        </div>
                    </div>

                    <!-- Payment Methods -->
                    <div>
                        <h4 class="text-md font-medium text-gray-900 dark:text-white mb-3">Métodos de Pago</h4>
                        <div id="adv-filter-payment" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div class="flex items-center"><input id="filter-yape" type="checkbox" data-payment="yape" class="h-4 w-4 text-fortnite-blue rounded border-gray-300 dark:border-gray-600 focus:ring-fortnite-blue"><label for="filter-yape" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Yape</label></div>
                            <div class="flex items-center"><input id="filter-plin" type="checkbox" data-payment="plin" class="h-4 w-4 text-fortnite-blue rounded border-gray-300 dark:border-gray-600 focus:ring-fortnite-blue"><label for="filter-plin" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Plin</label></div>
                            <div class="flex items-center"><input id="filter-transfer" type="checkbox" data-payment="transferencia" class="h-4 w-4 text-fortnite-blue rounded border-gray-300 dark:border-gray-600 focus:ring-fortnite-blue"><label for="filter-transfer" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Transferencia</label></div>
                            <div class="flex items-center"><input id="filter-izipay" type="checkbox" data-payment="izipay" class="h-4 w-4 text-fortnite-blue rounded border-gray-300 dark:border-gray-600 focus:ring-fortnite-blue"><label for="filter-izipay" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">IziPay</label></div>
                        </div>
                    </div>
                    
                    <!-- Date Range -->
                    <div>
                        <h4 class="text-md font-medium text-gray-900 dark:text-white mb-3">Rango de Fechas</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="filter-date-from" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Desde</label>
                                <input type="date" id="filter-date-from" class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-fortnite-blue focus:border-fortnite-blue sm:text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            </div>
                            <div>
                                <label for="filter-date-to" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Hasta</label>
                                <input type="date" id="filter-date-to" class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-fortnite-blue focus:border-fortnite-blue sm:text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            </div>
                        </div>
                    </div>

                    <!-- Amount Range -->
                    <div>
                        <h4 class="text-md font-medium text-gray-900 dark:text-white mb-3">Rango de Monto (S/.)</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="filter-amount-min" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Mínimo</label>
                                <input type="number" id="filter-amount-min" placeholder="0" class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-fortnite-blue focus:border-fortnite-blue sm:text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            </div>
                            <div>
                                <label for="filter-amount-max" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Máximo</label>
                                <input type="number" id="filter-amount-max" placeholder="1000" class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-fortnite-blue focus:border-fortnite-blue sm:text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                <button id="apply-filters" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-fortnite-blue text-base font-medium text-white hover:bg-fortnite-purple sm:ml-3 sm:w-auto sm:text-sm transition">Aplicar Filtros</button>
                <button id="reset-filters" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-600 text-base font-medium text-gray-700 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-500 sm:mt-0 sm:w-auto sm:text-sm transition">Restablecer</button>
            </div>
        </div>
    </div>
</div>
